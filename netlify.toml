[build]
  publish = "dist"
  command = "pip install -r requirements.txt && python scripts/build_static.py"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/state-*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
